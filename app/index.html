<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interlude</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Prototype: record platter styles. One empty section per style; the bar picks which one the decks draw. -->
    <prototype-switcher>
      <section data-style="beside" data-variant="Record Beside" data-note="Record on the outer side; title, overview waveform and times stacked beside it"></section>
      <section data-style="across" data-variant="Strip Across" data-note="Record and title on top; the overview waveform runs the full width of the deck below"></section>
      <section data-style="pads" data-variant="Record by Pads" data-note="The deck's usual top (title, overview, times); the record sits beside the cues and transport"></section>
      <section data-style="wave" data-variant="Waveform First" data-note="A small record beside the title and a tall overview waveform"></section>
    </prototype-switcher>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/proto/main.js"></script>
  </body>
</html>
