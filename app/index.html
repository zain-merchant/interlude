<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interlude</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Prototype: record platter styles. One empty section per style; the bar picks which one the decks draw. -->
    <prototype-switcher>
      <section data-style="clear-classic" data-variant="Classic Arm" data-note="Clear record, big centre, wide waveform ring; straight tonearm with counterweight and deck-coloured cartridge"></section>
      <section data-style="clear-s-arm" data-variant="S-Arm" data-note="Same record with a curved S-shaped tonearm"></section>
      <section data-style="clear-needle" data-variant="Light Needle" data-note="A thin line from pivot to stylus: the modern take on the tonearm"></section>
      <section data-style="clear-no-arm" data-variant="No Arm" data-note="The ring's playhead notch on its own"></section>
    </prototype-switcher>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/proto/main.js"></script>
  </body>
</html>
