<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interlude</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Prototype: record platter styles. One empty section per style; the bar picks which one the decks draw. -->
    <prototype-switcher>
      <section data-style="bpmcorner" data-variant="Time in Record" data-note="Elapsed and remaining in the record; BPM, key and phrase stacked in the top corner"></section>
      <section data-style="bpmrec" data-variant="BPM in Record" data-note="BPM, key and pitch in the record; elapsed and remaining stacked in the top corner"></section>
      <section data-style="column" data-variant="Times Under Title" data-note="BPM in the record; the title with one line of times under it"></section>
      <section data-style="titlebpm" data-variant="BPM Under Title" data-note="Time in the record; the title with BPM and key under it"></section>
    </prototype-switcher>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/proto/main.js"></script>
  </body>
</html>
