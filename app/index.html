<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interlude</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Prototype: record platter styles. One empty section per style; the bar picks which one the decks draw. -->
    <prototype-switcher>
      <section data-style="wide" data-variant="Big Waveform" data-note="Smaller record on the outer side; title and times along the top; a tall overview fills the rest"></section>
      <section data-style="over" data-variant="Title Over Both" data-note="Title and times across the deck; record and a tall overview side by side below"></section>
      <section data-style="across" data-variant="Strip Across" data-note="Record, title and a big elapsed time on top; the overview full width beneath"></section>
    </prototype-switcher>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/proto/main.js"></script>
  </body>
</html>
