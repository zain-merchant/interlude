<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1440" />
    <meta name="robots" content="noindex" />
    <title>Interlude, playing (clips)</title>
    <!-- Prototype: the hero as recorded clips (README in app/demo/segments).
         It speaks to the page as demo/hero.html does. -->
    <style>
      :root { color-scheme: dark; --tilt: -3deg; --anchor: 50% 0%; }
      html, body { margin: 0; width: 1440px; height: 920px; overflow: hidden; background: transparent; }
      #hero { position: relative; width: 1440px; height: 920px; overflow: hidden; }
      /* The app's box, as hero.css draws it (the rules themselves come from
         the recording, clips/manifest.json); the clips show inside it. */
      .app-host { height: 900px; }
      /* Of each pair, the one in front is playing; the next starts behind
         it and comes forward once its first frame is up. */
      .app-host video, .desk video { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
      video.front { z-index: 1; }
      /* The controller, in its box, seen through its outline at rest. It
         comes and goes as controller.css has it: from a little above, out
         of a blur, a beat behind the screen (--hw-delay). (The real one
         moves in its own perspective; this is that move flattened.) */
      .desk {
        position: absolute; pointer-events: none; z-index: 2;
        mask: var(--ctl-mask) 0 0 / 100% 100% no-repeat luminance;
        opacity: 0; transform: translateY(calc(var(--hw-from, -40px) * 0.4)) scale(0.985); filter: blur(var(--hw-blur, 10px));
        transition: transform var(--smooth-ms) var(--smooth), opacity 240ms cubic-bezier(0.4, 0, 1, 1), filter 240ms cubic-bezier(0.4, 0, 1, 1);
      }
      #hero[data-hand="controller"] .desk {
        opacity: 1; transform: none; filter: none;
        transition: transform var(--smooth-ms) var(--smooth) var(--hw-delay, 110ms), opacity 280ms cubic-bezier(0.2, 0, 0, 1) var(--hw-delay, 110ms), filter 340ms cubic-bezier(0.2, 0, 0, 1) var(--hw-delay, 110ms);
      }
      svg.links path { transition: none !important; }
      .cursor-layer { position: absolute; inset: 0; z-index: 200; pointer-events: none; transition: opacity 180ms cubic-bezier(0.4, 0, 1, 1); }
      .cursor-layer.away { opacity: 0; }
      .cursor-layer .ss-stage { position: absolute; inset: 0; }
      html[data-paused] *, html[data-paused] *::before, html[data-paused] *::after { animation-play-state: paused !important; }
    </style>
  </head>
  <body>
    <div id="hero" data-hand="mouse">
      <div class="app-host"><video muted playsinline preload="auto"></video><video muted playsinline preload="auto"></video></div>
      <div class="desk"><video muted playsinline preload="auto"></video><video muted playsinline preload="auto"></video></div>
      <svg class="links" width="1440" height="920"></svg>
      <div class="cursor-layer"><div class="hero-stage"><div class="ss-stage"></div></div></div>
    </div>
    <script type="module" src="./player.js"></script>
  </body>
</html>
