[workspace]
resolver = "2"
members = ["crates/engine", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"

[profile.dev]
# Audio code is unusable unoptimized; keep debug builds fast enough to play.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
