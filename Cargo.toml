[workspace]
resolver = "2"
members = ["crates/engine", "crates/controller", "crates/stems", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-or-later"

[profile.dev]
# Audio code is unusable unoptimized; keep debug builds fast enough to play.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
